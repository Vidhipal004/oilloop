services:
  - type: web
    name: oilloop
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_PUBLIC_DEMO_STATE
        value: "false"
      - key: PG_POOL_MAX
        value: "5"
